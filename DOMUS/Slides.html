# Counting houses
## Mapping late medieval populations using the DOMUS* model

### **Christian Vedel**, University of Southern Denmark
### Chiara Zanardello, Toulouse School of Economics

### Email: [christian-vs@sam.sdu.dk](mailto:christian-vs@sam.sdu.dk)

### Updated 2026-09-16

#### **Density-based Object Mapping of Urban Structures*

---
name: intro

# Why count people who have been dead for 400 years?

.pull-left[
- **Population** counts is very rich information on economic development.
- **Malthusian link** to development: Output `\(\Rightarrow\)` Population.
- **City databases:** Bairoch et al. (1988); Bosker, Buringh &amp; van Zanden (2013); **Buringh (2021)**: 2,258 cities, 700–2000. Relies heavily on inputations.
- **Applications:**
  - Nunn &amp; Qian (2011): *potatoes raised urban population*
  - Bosker et al. (2013): *Europe–Middle East divergence*
  - Many more
- Worth adding new sources with ML tools.

]

.pull-right[
![Urban population](Figures/buringh_urban_population.png)
.small123[*All cities in Buringh (2021), summed.*]
]

--

.pull-right[
&gt; .chaosred[**Very preliminary.**] A proof of concept. Ideas and applications are most welcome.
]

name: civitates

# The source: *Civitates Orbis Terrarum*


.pull-left[
.panelset[
.panel[.panel-name[Where it comes from]
- Edited in Cologne by **Georg Braun**; engraved and published by **Frans Hogenberg**. Six volumes, 1572–1617.
- **361 sheets, 543 views of 475 towns**; 95 pct. European. Over 50 towns appear more than once (Van der Krogt 2008).
- Drawings came from a wide network: Joris **Hoefnagel**'s travel sketches, Jacob **van Deventer**'s measured surveys, and copies of earlier prints.

.small123[
**Similar sources, readily available:** Münster, *Cosmographia* (1544–1628; hundreds of woodcut views) &amp;middot; Van Deventer's manuscript plans (c. 1558–1575; ~226 towns) &amp;middot; Blaeu, *Toonneel der Steden* (1649; 200+ Dutch plans) &amp;middot; Merian, *Topographia* (1642–1654; ~2,100 views) &amp;middot; Resen, *Atlas Danicus* (1677)
]
]
.panel[.panel-name[Can we trust it?]
- A **publishing enterprise, not a survey**: no sampling rule, no common scale. Selection followed contributors' travels and commercial appeal.
- Every plate passed through draftsmen, editors, and engravers. Monuments enlarged; repetitive housing schematised.
- But recognisability mattered: walls, churches, streets, and the overall fabric were what identified a town, and were kept (Nuti 1994; Ballon &amp; Friedman 2007).
]
]
]

.pull-right[
![Civitates Orbis Terrarum](Figures/odense_colour.jpg)
.small123[*Odense coloured in a coloured map.*]
]

name: ottomans

# Why is there always a couple standing in the foreground?

.pull-left-wide[
- The Ottoman Empire was the military threat of the 16th century. A detailed bird's-eye view of a city's walls is also an intelligence document.
- Braun's answer, stated in the preface to volume I: put **people in local dress** on every plate.
- Islamic religious practice forbade images of humans, so *"the bloodthirsty Turk ... will never allow this book to be seen"*.
]

.pull-right-narrow[
![Figures on the Odense plate](Figures/odense_figures.jpg)
.small123[*Foreground figures on the Odense plate. The costumes were taken from contemporary costume books.*]
]

--

.pull-left-wide[
&gt; Whatever we think of the argument, it tells us **how the makers saw the maps**: as accurate enough to be militarily useful.
]

# Back of the envelope

.pull-left-wide[
**Houses on the plate:** 883

**People per house:** 4.3
.small123[*(Leiden, 1561–1606; Van Steensel, van Oosten &amp; Hooymans 2025)*]

`$$883 \times 4.3 \approx 3{,}800 \text{ inhabitants}$$`
]

.pull-right-narrow[
![Odense with counted houses](Figures/cities_density/odense.jpg)
]

--
.pull-left-wide[
  &gt; *What do we get from other sources?*
&gt; - 3000-3200 in 1570, 
&gt; - 4000 in 1640.
&gt; Source: [Christiensen [Trap] (2021)](https://trap.lex.dk/1536-1850_i_Odense_Kommune#-Befolkningsudvikling)
]

--

.pull-left[
- In practice our plan is to run a regression of the form
`$$Pop_i = \beta_0 + \beta_1 \cdot Houses_i + \varepsilon_i$$`
Or even
`$$log(Pop_i) = \beta_0 + \beta_1 log(Houses_i) + \varepsilon_i$$`
]


---
name: how

# How do we get the predictions?

.pull-left[
- We view this as a **density regression problem**: the model predicts a smooth map whose integral gives the building count.
- This approach allows us to handle overlapping and ambiguous structures effectively.
- If a human can identify *one* point from each building, then this is a sample from the underlying building density.

**Target:** each labelled point `\(p_j\)` becomes a Gaussian bump; the bumps are summed:

`$$d(u) = \sum_{j} \mathcal{G}_\sigma(u - p_j), \qquad \sum_u d(u) = N$$`

.small123[*Output grid u at 1/4 of input resolution; σ = 2 output pixels, kernel truncated at 3σ and normalised to sum to one.*]
]

--

.pull-right[
### Loss function

The network outputs a log-density `\(z(u)\)`; the density is `\(\hat{d}(u) = e^{z(u)}\)` and the count `\(\hat{N} = \sum_u e^{z(u)}\)`.

`$$\mathcal{L} = \underbrace{\frac{1}{|\mathcal{U}|}\sum_{u}\Big(e^{z(u)} - d(u)\,z(u)\Big)}_{\text{Poisson NLL:} \textbf{ where}} \;+\; \lambda\,\underbrace{\big|\hat{N} - N\big|}_{\textbf{how many}}$$`

- `\(\lambda\)` annealed from 10 to 0.1 over training: totals first, then localisation.

.small123[
**Why Poisson, not MSE?** Most pixels are zero; softplus + MSE collapses to all-zero output and the gradient dies. The Poisson gradient e&lt;sup&gt;z&lt;/sup&gt; − d never vanishes where a building is.
]
]

---
name: methods-architectures

# Architectures

.pull-left[
### DOMUS-CNN
- **Encoder:** ResNet-18, ImageNet-pretrained, **frozen**.
- Feature pyramid at strides 4 / 8 / 16.
- **Decoder:** light U-Net; upsample and re-inject encoder features via skip connections (~0.5M trained parameters).
]

.pull-right[
### DOMUS-ViT
- **Encoder:** ViT-S/16 with self-supervised **DINO** weights, **frozen**.
- One feature map at stride 16, no pyramid.
- **Decoder:** plain upsampling back to stride 4, no skips (ViTDet-style).
]

--

.pull-left-wide[
&gt; Both output a density map for each building type we label.
]

---
name: training

# Training

.pull-left[
- **Data:** 105 labelled tiles for training, 12 for validation; each cut into 512 px crops (~950 before oversampling; crops with buildings are repeated ×4).
- **Augmentation:** flips, small rotations, zoom and stretch (points move with the image); channel shuffle, colour jitter, colour washes, noise, cutout.
- **Frozen encoder**, only the small decoder trains: 1,000 epochs (CNN); the ViT run stopped at 561.
- **Validation error:** 2.4 buildings per crop (CNN), 3.0 (ViT), against 8.4 for predicting the mean.
]

.pull-right[
![Validation error](Figures/training_val_mae.png)
]

name: results-refinement

# The signal sharpens as ambiguity is removed

.pull-left-narrow[
Same regression, progressively cleaner samples:

1. All matched plates (n = 251): slope 0.58
2. One Buringh city per plate (217): 0.62
3. One depiction per city (194): 0.71
4. One city, one plate (161): 0.72

.small123[*Text pages and multi-city plates add noise, not signal.*]
]

.center[&lt;img src="Figures/results/slope_progression_by_sample_1550.png" width="100%"&gt;]
]

name: results-viewpoint

# Viewpoint matters: the same city, drawn twice

.pull-left-narrow[
Cities with two independent plates in the atlas.

- A **detailed** and a **distant** view of the same city differ by a factor **~4** in counted buildings.
- Two distant views of the same city agree within ~20 pct.

&gt; The count measures what the engraver chose to show, not only what stood there.
]

# Where this is going

.pull-left[
### What we have
- A model that counts buildings on 16th-century plates from a few thousand clicks.
- Counts that track Buringh, with an elasticity near 1 when the city is seen from above.

### What is next
- One image per city: crop multi-city plates, drop non-city pages.
- Validate against city-specific sources, not only Buringh.
- More atlases: Merian, Blaeu, Resen.

(function(d) {
  const hlines = d.querySelectorAll('.remark-code-line-highlighted');
  const preParents = [];
  const findPreParent = function(line, p = 0) {
    if (p > 1) return null; // traverse up no further than grandparent
    const el = line.parentElement;
    return el.tagName === "PRE" ? el : findPreParent(el, ++p);
