<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .navy { fill: #1a1a1a; }
      .appl { fill: #2c5c34; }
      .tool { fill: #b33d3d; }
      .red { fill: #b33d3d; }
      .pale { fill: #f6f4ef; }
      .ttl { font-size: 30px; font-weight: bold; fill: #ffffff; }
      .sub { font-size: 21px; fill: #ffffff; font-style: italic; }
      .item { font-size: 23px; fill: #222222; }
      .itemb { font-size: 23px; fill: #222222; font-weight: bold; }
      .note { font-size: 18px; fill: #666666; font-style: italic; }
      .base { font-size: 26px; fill: #ffffff; font-weight: bold; }
    </style>
  </defs>

  <!-- capstone -->
  <polygon class="red" fill="#000000" style="fill:#000000" points="330,20 870,20 815,150 385,150"/>
  <text x="600" y="62" text-anchor="middle" class="ttl">A Perfect Storm</text>
  <text x="600" y="96" text-anchor="middle" class="sub">the job market paper</text>
  <text x="600" y="128" text-anchor="middle" class="sub">a big question, answered with new tools</text>

  <!-- arrows from capstone to pillars -->
  <path d="M395,120 C320,120 300,150 300,175" stroke="#1a1a1a" stroke-width="4" fill="none"/>
  <path d="M805,120 C880,120 900,150 900,175" stroke="#1a1a1a" stroke-width="4" fill="none"/>

  <!-- left pillar -->
  <rect class="appl" x="80" y="175" width="440" height="34" rx="3"/>
  <rect class="pale" x="125" y="263" width="350" height="259"/>
  <line x1="126.5" y1="263" x2="126.5" y2="522" stroke="#2c5c34" stroke-width="3"/>
  <line x1="473.5" y1="263" x2="473.5" y2="522" stroke="#2c5c34" stroke-width="3"/>
  <rect class="appl" x="105" y="207" width="390" height="58"/>
  <text x="300" y="248" text-anchor="middle" class="ttl">Big Questions</text>
  <text x="300" y="300" text-anchor="middle" class="note">How do places and people respond</text>
  <text x="300" y="324" text-anchor="middle" class="note">when opportunities change?</text>
  <text x="150" y="368" class="itemb">• A Perfect Storm</text>
  <text x="150" y="403" class="item">• Tracks to Modernity</text>
  <text x="150" y="438" class="item">• Holy Cows and Spilled Milk</text>
  <text x="150" y="473" class="item">• Energy Shocks</text>
  <text x="150" y="508" class="item">• Physical Memories</text>
  <rect class="appl" x="105" y="520" width="390" height="22"/>

  <!-- right pillar -->
  <rect class="tool" x="680" y="175" width="440" height="34" rx="3"/>
  <rect class="pale" x="725" y="263" width="350" height="259"/>
  <line x1="726.5" y1="263" x2="726.5" y2="522" stroke="#b33d3d" stroke-width="3"/>
  <line x1="1073.5" y1="263" x2="1073.5" y2="522" stroke="#b33d3d" stroke-width="3"/>
  <rect class="tool" x="705" y="207" width="390" height="58"/>
  <text x="900" y="248" text-anchor="middle" class="ttl">Machine Learning Tools</text>
  <text x="900" y="300" text-anchor="middle" class="note">We only know what we can measure</text>
  <text x="900" y="324" text-anchor="middle" class="note">— so build the measurement</text>
  <text x="750" y="368" class="itemb">• OccCANINE</text>
  <text x="750" y="403" class="item">• ML bias in EH</text>
  <text x="750" y="438" class="item">• CHAOS</text>
  <text x="750" y="473" class="item">• Counting Houses (DOMUS)</text>
  <rect class="tool" x="705" y="520" width="390" height="22"/>

  <!-- shared base -->
  <rect class="navy" x="40" y="560" width="1120" height="62" rx="4"/>
  <text x="600" y="600" text-anchor="middle" class="base">Why do some places prosper while others do not?</text>
</svg>
