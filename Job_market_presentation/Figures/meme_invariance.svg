<svg xmlns="http://www.w3.org/2000/svg" viewBox="-90 0 1020 640" font-family="Georgia, 'Times New Roman', serif">
  <!-- The meme DAG (meme_dag.svg) with the environment of each copy, linked both ways to the meme and to its outcome, each hit by an intervention (hammer),
       after Peters, Buhlmann & Meinshausen (2016), Fig. 1. The meme still copies itself and has the same effect; a mutation is a new meme. -->

  <!-- arrowheads are drawn as polygons, not markers: the slide is revealed in steps, so the SVG appears twice and marker ids would clash -->

  <!-- row labels -->
  <text x="-80" y="88" font-size="22" fill="#666666" font-style="italic">environment</text>
  <text x="-80" y="278" font-size="24" fill="#666666" font-style="italic">meme</text>
  <text x="-80" y="528" font-size="24" fill="#666666" font-style="italic">outcome</text>

  <!-- the environment of each copy, each hit by a hammer -->
  <rect x="190" y="50" width="80" height="60" rx="10" fill="#efede8" stroke="#8a867e" stroke-width="3"/>
  <text x="230" y="91" text-anchor="middle" font-size="30" font-style="italic" fill="#5a574f">e₁</text>
  <rect x="460" y="50" width="80" height="60" rx="10" fill="#efede8" stroke="#8a867e" stroke-width="3"/>
  <text x="500" y="91" text-anchor="middle" font-size="30" font-style="italic" fill="#5a574f">e₂</text>
  <rect x="730" y="50" width="80" height="60" rx="10" fill="#efede8" stroke="#8a867e" stroke-width="3"/>
  <text x="770" y="91" text-anchor="middle" font-size="30" font-style="italic" fill="#5a574f">e₃</text>

  <g transform="translate(296,46) rotate(30)"><rect x="-5" y="0" width="10" height="50" rx="3" fill="#8a6a45"/><rect x="-22" y="-13" width="44" height="17" rx="3" fill="#b33d3d"/></g>
  <g transform="translate(566,46) rotate(30)"><rect x="-5" y="0" width="10" height="50" rx="3" fill="#8a6a45"/><rect x="-22" y="-13" width="44" height="17" rx="3" fill="#b33d3d"/></g>
  <g transform="translate(836,46) rotate(30)"><rect x="-5" y="0" width="10" height="50" rx="3" fill="#8a6a45"/><rect x="-22" y="-13" width="44" height="17" rx="3" fill="#b33d3d"/></g>

  <line x1="230" y1="124" x2="230" y2="200" stroke="#8a867e" stroke-width="4"/><polygon points="230.0,212.0 210.0,172.0 250.0,172.0" fill="#8a867e"/><polygon points="230.0,112.0 250.0,152.0 210.0,152.0" fill="#8a867e"/>
  <line x1="500" y1="124" x2="500" y2="200" stroke="#8a867e" stroke-width="4"/><polygon points="500.0,212.0 480.0,172.0 520.0,172.0" fill="#8a867e"/><polygon points="500.0,112.0 520.0,152.0 480.0,152.0" fill="#8a867e"/>
  <line x1="770" y1="124" x2="770" y2="200" stroke="#8a867e" stroke-width="4"/><polygon points="770.0,212.0 750.0,172.0 790.0,172.0" fill="#8a867e"/><polygon points="770.0,112.0 790.0,152.0 750.0,152.0" fill="#8a867e"/>

  <!-- meme nodes -->
  <circle cx="230" cy="270" r="52" fill="#f6f4ef" stroke="#1a1a1a" stroke-width="4"/>
  <text x="230" y="288" text-anchor="middle" font-size="52" font-style="italic" fill="#1a1a1a">m</text>
  <circle cx="500" cy="270" r="52" fill="#f6f4ef" stroke="#1a1a1a" stroke-width="4"/>
  <text x="500" y="288" text-anchor="middle" font-size="52" font-style="italic" fill="#1a1a1a">m</text>
  <circle cx="770" cy="270" r="52" fill="#fbecec" stroke="#b33d3d" stroke-width="4"/>
  <text x="770" y="288" text-anchor="middle" font-size="52" font-style="italic" fill="#b33d3d">m′</text>

  <!-- replication arrows -->
  <line x1="288" y1="270" x2="430" y2="270" stroke="#1a1a1a" stroke-width="5"/><polygon points="445.0,270.0 395.0,295.0 395.0,245.0" fill="#1a1a1a"/>
  <text x="296" y="240" text-anchor="start" font-size="26" fill="#1a1a1a">copy</text>
  <line x1="558" y1="270" x2="700" y2="270" stroke="#b33d3d" stroke-width="5"/><polygon points="715.0,270.0 665.0,295.0 665.0,245.0" fill="#b33d3d"/>
  <text x="635" y="240" text-anchor="middle" font-size="26" fill="#b33d3d">mutation</text>

  <!-- effect arrows -->
  <line x1="230" y1="328" x2="230" y2="450" stroke="#1a1a1a" stroke-width="5"/><polygon points="230.0,465.0 205.0,415.0 255.0,415.0" fill="#1a1a1a"/>
  <line x1="500" y1="328" x2="500" y2="450" stroke="#1a1a1a" stroke-width="5"/><polygon points="500.0,465.0 475.0,415.0 525.0,415.0" fill="#1a1a1a"/>
  <line x1="770" y1="328" x2="770" y2="450" stroke="#b33d3d" stroke-width="5"/><polygon points="770.0,465.0 745.0,415.0 795.0,415.0" fill="#b33d3d"/>
  <text x="245" y="400" font-size="24" fill="#666666" font-style="italic">same effect</text>

  <!-- the environment also moves the outcome directly; the middle path crosses the copy arrow, so it gets a white halo -->
  <path d="M196,122 C80,200 80,420 176,505" fill="none" stroke="#8a867e" stroke-width="4"/><polygon points="185.0,513.0 141.8,501.4 168.3,471.5" fill="#8a867e"/><polygon points="206.0,115.3 183.9,154.2 161.6,121.0" fill="#8a867e"/>
  <path d="M466,122 C350,200 350,420 446,505" fill="none" stroke="#ffffff" stroke-width="14"/>
  <path d="M466,122 C350,200 350,420 446,505" fill="none" stroke="#8a867e" stroke-width="4"/><polygon points="455.0,513.0 411.8,501.4 438.3,471.5" fill="#8a867e"/><polygon points="476.0,115.3 453.9,154.2 431.6,121.0" fill="#8a867e"/>
  <path d="M804,122 C920,200 920,420 824,505" fill="none" stroke="#8a867e" stroke-width="4"/><polygon points="815.0,513.0 831.7,471.5 858.2,501.4" fill="#8a867e"/><polygon points="794.0,115.3 838.4,121.0 816.1,154.2" fill="#8a867e"/>

  <!-- outcome nodes -->
  <rect x="180" y="470" width="100" height="90" rx="10" fill="#ffffff" stroke="#2c5c34" stroke-width="4"/>
  <text x="230" y="532" text-anchor="middle" font-size="52" font-style="italic" fill="#2c5c34">Y</text>
  <rect x="450" y="470" width="100" height="90" rx="10" fill="#ffffff" stroke="#2c5c34" stroke-width="4"/>
  <text x="500" y="532" text-anchor="middle" font-size="52" font-style="italic" fill="#2c5c34">Y</text>
  <rect x="720" y="470" width="100" height="90" rx="10" fill="#fbecec" stroke="#b33d3d" stroke-width="4"/>
  <text x="770" y="532" text-anchor="middle" font-size="52" font-style="italic" fill="#b33d3d">Y′</text>

  <text x="420" y="612" text-anchor="middle" font-size="25" fill="#1a1a1a">hammers hit the environment, never <tspan font-style="italic">Y</tspan>: <tspan font-style="italic">Y</tspan> | <tspan font-style="italic">m</tspan>, <tspan font-style="italic">e</tspan> is the same under every intervention</text>
</svg>
