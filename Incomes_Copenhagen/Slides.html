# The Tax Books

---
# Copenhagen's Income Tax

.pull-left[
**The law**
- Enacted **15 May 1861**
- 50 years before national tax
- Covers residents and wealthy non-residents

**What was taxed**
- Salaries, profits, rents, investments
- Net income after expenses
]

.pull-right[
**Key features**
- 800 kr basic deduction
- Tax unit: household head
- Available annually **1862–1918**

**Scale**
- 40 books digitised
- ~2.1 million records
- ~17,000 (1862) → ~164,000 (1919) taxpayers
]

# Digitising with Google Gemini

---
# The Challenge

.pull-left[
**The data**
- 40 books, each 300–1,500 pages
- Machine-written tabular format
- Five distinct layouts over time
- Addresses printed once per block

**Why standard OCR fails**
- Column alignment varies
- No clean row delimiters
]

.pull-right[
**Solution: vision LLM reads each page**

&lt;div class="step-box"&gt;&lt;strong&gt;1.&lt;/strong&gt; Split PDF → one PNG per page&lt;/div&gt;
&lt;div class="step-box"&gt;&lt;strong&gt;2.&lt;/strong&gt; Image + prompt + schema → &lt;strong&gt;Gemini 2.5 Flash&lt;/strong&gt;&lt;/div&gt;
&lt;div class="step-box"&gt;&lt;strong&gt;3.&lt;/strong&gt; Receive structured JSON per row&lt;/div&gt;
&lt;div class="step-box"&gt;&lt;strong&gt;4.&lt;/strong&gt; Assemble → one CSV per book&lt;/div&gt;
&lt;div class="step-box"&gt;&lt;strong&gt;5.&lt;/strong&gt; Occupations → HISCO via &lt;em&gt;OccCANINE&lt;/em&gt;&lt;/div&gt;

Total: **40 books · ~2.1 million records**
]

---
# Gemini — How Each Page Is Processed

.pull-left[
**The API call**

```python
image = load_page_as_image(pdf, page_n)

response = gemini_client.generate_content([
    system_prompt,   # column layout
    image,           # page PNG
    output_schema,   # Pydantic model
])

rows = response.parsed  # list of TaxRow objects
```

**The prompt tells Gemini:**
- Column order and meaning
- Forward-fill blank addresses
- Currency conventions
- How to flag illegible entries
]

.pull-right[
**Parsed row example**

```json
{
  "surname": "Andersen",
  "initials": "H.C.",
  "street": "Nyhavn",
  "house_number": "67",
  "occupation": "Professor",
  "income_reported_100_kroner": 36,
  "rode": "2"
}
```

**Scale and speed**
- 400–1,500 pages per book
- ~3–5 seconds per page
- Full book under 2 hours
]

---
# The Prompt (1889–1903 era)

.scroll-box[
```
You are extracting rows from a historical Danish printed table from 1889-90.

COLUMNS:
- rode: the district/route name from the page header to the left
  (e.g., "Nyhavns Rode"). Copy exactly as printed.
- qvarter: the neighborhood name from the page header to the right
  (e.g., "St. Anne Øster Kvarter"). Copy exactly as printed.
- gade: CRITICAL - the street name embedded as headers within the table.
  * When a street name appears, use it for all subsequent rows until
    a new street name appears.
  * If NO street name appears (table continues from previous page),
    use "FROM PREVIOUS PAGE" for all rows.
- gadenr: the number from the leftmost "Gade" column.
- name: person's full name only from "Navn og Stand" column.
- stand: occupation/status only from "Navn og Stand" column.
- income_reported_100_kroner: number from "Den antagne Indtægt" column.
- income_reported_tax_100_kroner: number from "Skatteindtægt" column.
- reduction_par4_100_kroner: number under "Nedsættelse efter §4".
- tax_quarter_kroner and tax_quarter_ore: numbers under
  "Indkomstskat for hvert af Aarets 4 Kvartaler".

RULES:
- Parse numbers as numbers. Convert fractions like '1/2' to 0.5.
- Income columns are in hundreds of Kroner — do NOT multiply.
- If a cell is blank or a ditto mark, leave it null.
- Ignore dotted leader lines and page ornaments.
- Keep Danish diacritics exactly as printed.
- If print is unreadable, leave null and add a reason in 'notes'.
- STREET NAME LOGIC: street names appear as centered headers between
  data rows. Once found, apply to all rows below until a new one appears.

Return only JSON that matches the schema.
```
]

.note[Five prompt variants cover layout changes across 1862–1919. Switching is a one-line change in `run.py`.]
