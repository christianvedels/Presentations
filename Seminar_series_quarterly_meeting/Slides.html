# From suggestion to departure

.panelset[
.panel[.panel-name[Before the visit]

1. **Suggest** .small123[*(ongoing)*]&lt;br&gt;Colleagues send speaker suggestions to the organisers. The colleague who suggests usually hosts.

2. **Invite** .small123[*(the semester before)*]&lt;br&gt;We invite the speaker with the open Tuesdays. They pick three dates; we confirm and explain the reimbursement rules.

3. **Gather details** .small123[*(a few months ahead)*]&lt;br&gt;Travel dates, title and abstract, the paper, and any dietary needs.

4. **Book** .small123[*(once travel is known)*]&lt;br&gt;Order form to the secretariat, who book the hotel (two nights) and the dinner restaurant.
]

.panel[.panel-name[The week before]

1. **Start of week: announcement**&lt;br&gt;Email to everyone in Econ and CPOP: a short bio of the speaker, their website, the paper, and the sign-up form.

2. **Thursday 16:00: sign-up closes**&lt;br&gt;Office meetings (30 min), lunch, and dinner, through Microsoft Forms.

3. **Friday: schedule out**&lt;br&gt;An algorithm builds the day's schedule from the sign-ups:
    - It fits as many people as possible into one unbroken block of meetings
    - Anyone already joining lunch or dinner gives up their slot if someone else would otherwise miss the speaker
    - The schedule is then sent to colleagues and the speaker
]

.panel[.panel-name[The visit]

.pull-left[
**Monday: arrival**&lt;br&gt;The speaker arrives in Odense (usually by train from Copenhagen Airport) and checks in at Hotel Odeon.

**Wednesday: departure**&lt;br&gt;The speaker leaves. We send a thank-you with the reimbursement form; receipts are due within a week.
]

.pull-right[
**Tuesday: seminar day**
- **10:00** Office meetings
- **~12:00** Lunch with colleagues
- **12:45–13:45** .red[**Seminar**]
- **13:45** PhD student group
- **14:30–16:30** Office meetings
- **Before dinner** We often go for drinks
- **~18:00** Dinner
]
]
]

???
Click through the three tabs. Point: suggestions can come from anyone in the department. Announcement, sign-up and schedule all happen the week BEFORE the visit.
