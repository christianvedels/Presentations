# The tool we present: *CHAOS*

--

1. If you have a *Source* containing: Occupations + some outcome (skills, income, etc.)

--

2. A *Target* containing: Occupations only (e.g. census data)

--

3. We provide a method for map any target occupation to a predicted outcome

--

**Approach:** We do probabilistic mapping to a standardized scheme. E.g. HISCO as an intermediate step


--

.pull-left-narrow[

- Source: `\(\{d_i, y_i\}\)`

# Econometric framework

---
name: bias

# Problem: Bias from occ. scores

`$$y_i = \alpha + \beta x_i + \varepsilon_i$$`

.small123[
where `\(y_i\)` is the true outcome (e.g. wage) to be replaced with `\(\mu_S(d_i)\)` s.t.
]

--

`$$\mu_S(d_i) = \alpha + \beta x_i + \varepsilon_i$$`


--

.pull-left-wide[
.small123[
Let `\(\mu_S(d_i)\)` be the source-assigned score, `\(\mu_T(d_i)\)` the target-population mean, `\(y_i\)` the true outcome. The total proxy error decomposes as:

`$$m_i \;=\; \underbrace{\mu_S(d_i) - \mu_T(d_i)}_{\delta(d_i)\ \text{source-target drift}} \;+\; \underbrace{\mu_T(d_i) - y_i}_{r_i\ \text{within-occupation residual}}$$`

Then:

`$$\hat{\beta} = \beta + \frac{\text{Cov}(x_i,\, m_i)}{\text{Var}(x_i)}$$`

]
]

.pull-right-narrow[
### The two big problems of occupational scores:
.small123[
`\(\delta(d_i)\)` — **source-target drift**
1950 US wages `\(\neq\)` 1850 England.

`\(r_i\)` — **within-occupation residual**
Apprentice `\(\neq\)` master;
]
]

--

.pull-left-wide[
`$$\require{cancel}$$`
`\(m_i \;=\; \cancel{\underbrace{\mu_S(d_i) - \mu_T(d_i)}_{\delta(d_i)\ \text{source-target drift}}} \;+\; \underbrace{\mu_T(d_i) - y_i}_{r_i\ \text{within-occupation residual}}\)`
]

.pull-right-narrow[
.chaosred[**CHAOS addresses the first and formalizes the second.**]
]

???

name: chaos-math

# The CHAOS estimator

1. **Source–target relevance** — source and target drawn from the same `\((D, Y, H)\)` distribution
2. **Broadband** — `\(\mathbb{E}[Y \mid H, D] = \mathbb{E}[Y \mid H]\)`; the category is sufficient for `\(Y\)`
3. **Oracle access** — classifier gives `\(h(d,k) = \Pr(H{=}k \mid D{=}d)\)` for every description

--

.pull-left[
**Step A.1** — estimate (wrong) means from the source:

`$$\hat{r}_k = \frac{\sum_{i \in \mathcal{S}} Y_i\,h(D_i,k)}{\sum_{i \in \mathcal{S}} h(D_i,k)}$$`

This is biased, but we can get a handle on it:

`$$r_k = \sum_{j} A_{kj}\,\mu_j, \qquad A_{kj} = \mathbb{E}[h(D,j) \mid H=k]$$`

**Step A.2** — recover unbiased estimates by inverting the confusion matrix:

`$$\hat{\mu} = \hat{A}^{-1}\hat{r}$$`

]

--

.pull-right[
**Step B** — apply to any target description `\(d\)`:

`$$\hat{y}(d) = \sum_{k \in \mathcal{H}} \hat{\mu}_k\, h(d, k)$$`

Equivalently: `\(\hat{y}(d) = \sum_{i \in \mathcal{S}} W_i(d)\,Y_i\)` — a weighted average of source outcomes, with weights summing to 1.
]

[Why the correction is needed](#appendix-broadband-assumption)

---
name: method-check

# Checking results — evidence for each prediction

--

.pull-left[
### Evidence — how much of the source is about `\(d\)`?

`$$\widehat{\mathrm{ev}}(d) = \sum_{k} h(d,k)\;\frac{1}{n_{\mathcal{S}}}\sum_{i \in \mathcal{S}} h(D_i, k)$$`

&gt; Share of the source truly belonging to this occupation. Computable from descriptions alone — before any outcome is collected.
]

--

.pull-right[
### Effective observations

`$$n_\text{eff}(d) = \frac{1}{\displaystyle\sum_i W_i(d)^2}$$`

&gt; *How many source observations effectively back this prediction?*

- Accounts for the **confusion discount** — mass spread across HISCO codes reduces precision
- Equals `\(N_\text{source} \times \text{Evidence}(d)\)` only under hard assignment (`\(A = I\)`)
- Low `\(n_\text{eff}\)` `\(\Rightarrow\)` reverts toward the source mean
]

---
name: chaos-se

# Standard errors

&gt; All sampling variation in `\(\hat{y}(d)\)` runs through a single residual `\(\hat{\varepsilon}_i = Y_i - \hat{y}(D_i)\)` per source observation.

.small123[Following Kennedy (2023, arXiv:2203.06469); 

--

.pull-left[
**Influence value** for observation `\(i\)` at target description `\(d\)`:

`$$\hat{\phi}_{d,i} = h(d)^\top \hat{A}^{-1}\hat{s}_i, \qquad \hat{s}_{i,k} = \frac{h(D_i,k)\;\hat{\varepsilon}_i}{\hat{B}_k}$$`

where `\(\hat{B}_k = \frac{1}{n_\mathcal{S}}\sum_i h(D_i,k)\)` is the average classifier mass on code `\(k\)`.
]

.pull-right[
**Standard error:**

`$$\widehat{\mathrm{se}}\bigl(\hat{y}(d)\bigr) = \sqrt{\frac{1}{n_{\mathcal{S}}^2}\sum_{i \in \mathcal{S}} \hat{\phi}_{d,i}^2}$$`

- One score per source row, no distributional assumptions
- Matches Monte Carlo standard deviations closely
]

[Full 3-step derivation](#appendix-influence-function)

name: appendix-math-advanced

# CHAOS: multiple sources + debiasing .chaosred[(if time)]

.pull-left[
.small123[
### Multiple sources
When sources `\(\mathcal{S}_1, \dots, \mathcal{S}_S\)` are available, pool them to estimate `\(\hat{A}\)` and `\(\hat{r}\)`:

`$$\hat{A}_{kj} = \frac{\sum_s \sum_{i \in \mathcal{S}_s} h(D_i,j)\,h(D_i,k)}{\sum_s \sum_{i \in \mathcal{S}_s} h(D_i,k)}$$`

Then apply `\(\hat{\mu} = \hat{A}^{-1}\hat{r}\)` as before. No change to Step B.

### Gibberish input
If the classifier is uninformative: `\(h(d,k) \approx \bar{h}_k\)` (flat), then `\(\hat{y}(d) \approx \bar{Y}\)` — prediction reverts to the source mean.
]
]

.pull-right[
.small123[
### LOO calibration check

The `\(\hat{A}^{-1}\)` confusion correction ([see appendix](#appendix-confusion-correction)) supersedes the PPI-style mean correction.

A closed-form LOO residual provides a free calibration diagnostic — no extra computation needed:

`$$\hat{y}^{(-i)}(D_i) = \frac{\hat{y}(D_i) - P_{ii}\,Y_i}{1 - P_{ii}}$$`

where `\(P_{ii} = h(D_i)^\top(\mathbf{H}^\top\mathbf{H})^{-1}h(D_i)\)` is the hat-matrix leverage. If LOO predictions track source actuals, the `\(\hat{A}^{-1}\)` step is working.
]
]

name: appendix-broadband-assumption

# Broadband — what the assumption really requires

&gt; **Assumption 2 (Broadband):** `\(\mathbb{E}[Y \mid H, D] = \mathbb{E}[Y \mid H]\)`
&gt; Once the occupational category is known, the text description adds no further information about the conditional mean of `\(Y\)`.

.pull-left-wide[
### Two conditions that satisfy it

1. **Hard assignment** — the classifier returns one code with probability 1. Knowing `\(D\)` already determines `\(H\)` exactly; the text carries no residual information.

2. **Constant within-category mean** — every description mapping to category `\(k\)` yields the same expected outcome, regardless of exact wording.

Classical scores (e.g. OCCSCORE) implicitly assume **(1)**. Probabilistic classifiers require making this explicit.
]

.pull-right-narrow[
.small123[
If a "journeyman blacksmith" and a "master blacksmith" earn different wages within HISCO 83110, neither condition holds — the Broadband assumption fails.

`\(H\)` must be sufficient for the regression of `\(Y\)` on `\((D, H)\)`.
]
]

[Back to slides](#chaos-math)

name: appendix-confusion-bias

# The naive weighted average is biased

The natural first move — relevance-weighted average of source outcomes:

`$$\hat{r}_k = \frac{\sum_{i \in \mathcal{S}} Y_i \, h(D_i, k)}{\sum_{i \in \mathcal{S}} h(D_i, k)}$$`

.pull-left[
### What it converges to

`$$r_k = \sum_{j} A_{kj} \, \mu_j, \qquad A_{kj} = \mathbb{E}[h(D,j) \mid H = k]$$`

`\(A_{kj}\)` = expected classifier probability of category `\(j\)` among true-$k$ observations — the **confusion matrix**.

`\(\hat{r}_k \to r_k \neq \mu_k\)`
]

.pull-right[
### Intuition

| | `\(h(\cdot, \text{blksmth})\)` | `\(h(\cdot, \text{hmrsmth})\)` |
|---|---|---|
| "Blacksmith" | 0.955 | 0.011 |
| "Hammersmith" | **0.112** | 0.851 |

The blacksmith average absorbs hammersmith income. `\(\hat{r}_\text{blacksmith}\)` is dragged toward `\(\mu_\text{hammersmith}\)`.

.small123[Classical scores assume `\(A = I\)` — this contamination simply does not appear.]
]

[Back to slides](#chaos-math)

name: appendix-confusion-correction

# The fix: invert the confusion matrix

Since `\(r = A\mu\)` and `\(A\)` is identifiable from classifier probabilities alone, the correction is:

`$$\hat{\mu} = \hat{A}^{-1} \hat{r}$$`

.pull-left[
**Estimating `\(\hat{A}\)`** — no outcome data needed:

`$$\hat{A}_{kj} = \frac{\sum_{i \in \mathcal{S}} h(D_i, j)\, h(D_i, k)}{\sum_{i \in \mathcal{S}} h(D_i, k)}$$`

- Classical scores: `\(A = I\)` (implicit assumption)
- Sharp classifier: `\(A \approx I\)`, small correction
- Near-singular `\(A\)`: aggregate sibling codes
]

.pull-right[
**OLS equivalence** — `\(\hat{\mu}\)` is numerically identical to:

`$$\hat{\mu} = (\mathbf{H}^\top \mathbf{H})^{-1} \mathbf{H}^\top \mathbf{Y}$$`

No-intercept regression of `\(Y_i\)` on the probability vector `\(h(D_i)\)`.

]

[Back to slides](#chaos-math)

---
name: appendix-influence-function

# Standard errors via the influence function

Since `\(h\)` is known, all sampling variation comes from estimating `\((r, A)\)` on `\(\mathcal{S}\)`.

.panelset[
.panel[.panel-name[Step 1: scores of r̂ and Â]

Both `\(\hat{r}_k\)` and `\(\hat{A}_{kj}\)` are ratios of sample means. The ratio rule for influence functions gives:

.pull-left[
`$$\phi^r_k(Y,D) = \frac{h(D,k)}{B_k}\bigl(Y - r_k\bigr)$$`
]

.pull-right[
`$$\phi^A_{kj}(D) = \frac{h(D,k)}{B_k}\bigl(h(D,j) - A_{kj}\bigr)$$`
]

where `\(B_k = \mathbb{E}[h(D,k)]\)` is the expected classifier mass on code `\(k\)`. The second follows from the first by replacing `\(Y\)` with `\(h(D,j)\)`.
]

.panel[.panel-name[Step 2: chain rule through Â⁻¹]

Perturbing `\(\mu = A^{-1}r\)` gives `\(\mathrm{d}\mu = A^{-1}\bigl(\mathrm{d}r - (\mathrm{d}A)\mu\bigr)\)`. The `\(k\)`-th entry of the bracket collapses:

.pull-left[
`$$\bigl(\phi^r - \phi^A\mu\bigr)_k = \frac{h(D,k)}{B_k}\,\varepsilon, \quad \varepsilon := Y - \mathbb{E}[Y \mid D]$$`

The entire influence function runs through a single residual `\(\varepsilon\)` — one score per source row, regardless of `\(K\)`.
]

.pull-right[
Compact form:

`$$\phi^\mu(Y,D) = A^{-1}\, s(Y,D), \quad s_k := \frac{h(D,k)\,\varepsilon}{B_k}$$`

The `\(\hat{A}^{-1}\)` correction propagates through the IF automatically.
]
]

.panel[.panel-name[Step 3: prediction SE]

For a fixed target description `\(d\)`, the IF of `\(\hat{y}(d) = h(d)^\top\hat{\mu}\)` is `\(\phi_d = h(d)^\top A^{-1} s(Y,D)\)`.

.pull-left[
Plug-in with `\((\hat{A},\hat{B},\hat{\mu})\)` and residual `\(\hat\varepsilon_i = Y_i - h(D_i)^\top\hat{\mu}\)`:

`$$\hat{\phi}_{d,i} = h(d)^\top \hat{A}^{-1}\hat{s}_i, \quad \hat{s}_{i,k} = \frac{h(D_i,k)\,\hat\varepsilon_i}{\hat{B}_k}$$`
]

.pull-right[
Standard error from the sample variance of influence values:

`$$\widehat{\mathrm{se}}\bigl(\hat{y}(d)\bigr) = \sqrt{\frac{1}{n_{\mathcal{S}}^2}\sum_{i \in \mathcal{S}} \hat{\phi}_{d,i}^2}$$`

- One value per source row, no distributional assumptions
- Matches the simulation's Monte Carlo SDs closely
]
]
]

[Back to slides](#method-check)

.panel[.panel-name[Step A: correction]

.pull-left[

HISCO-level estimates — top 5 codes:

| | 83110 | 83120 | 87340 | 88050 | 80110 |
|---|---|---|---|---|---|
| Mass `\(s_k\)` | 1.221 | 0.873 | 0.984 | 0.932 | 0.990 |

]

Target "He is a blacksmith" `\(\;\Rightarrow\;\)` `\(h(d) = (0.951,\, 0.024,\, 0.013,\, 0.007,\, 0.005)\)` `\(\;\Rightarrow\;\)` `\(\hat{y}(d) = \mathbf{2.796}\)`

name: appendix-bias-rhs

# Bias when the occupational score is on the RHS

.pull-left-wide[
Now suppose `\(\hat{y}_i\)` is the **explanatory variable**:

`$$x_i = \alpha + \beta_2 \hat{y}_i + \varepsilon_i, \quad \hat{y}_i = y_i + m_i$$`

The OLS estimator gives:

`$$\hat{\beta}_2 = \beta_2 \!\left(1 - \frac{\text{Var}(m_i)}{\text{Var}(y_i)}
\right) - \frac{\text{Cov}(y_i,\, m_i)}{\text{Var}(y_i)} + \frac{\text{Cov}(m_i,\, \varepsilon_i)}{\text{Var}(y_i)}$$`

Two sources of bias:

1. **Attenuation** -- `\(\text{Var}(m_i)\)` dilutes the signal, shrinking `\(\hat{\beta}_2\)` toward zero
2. **Correlation bias** -- if `\(m_i\)` co-moves with `\(y_i\)` or `\(\varepsilon_i\)`, slope shifts unpredictably
]

.pull-right-narrow[
Recall `\(m_i = \hat{y}_i - y_i\)` decomposes as `\(\delta(d_i) + r_i\)` (drift + residual):

- `\(\delta\)` correlated with `\(x_i\)` `\(\Rightarrow\)` correlation bias. CHAOS .green[**reduces**] `\(\delta\)`.
- `\(r_i\)` correlated with `\(x_i\)` `\(\Rightarrow\)` .chaosred[**irreducible.**]
- Attenuation always present; CHAOS reduces `\(\text{Var}(m_i)\)` by eliminating `\(\delta\)`.
]

name: appendix-category-aggregation

# When `\(\hat{A}\)` is near-singular: aggregate sibling codes

If the condition number `\(\kappa(\hat{A}) &gt; \tau\)`, matrix inversion amplifies noise. The fix: coarsen the code space by merging hard-to-separate codes.

.pull-left[
### Greedy algorithm

1. Compute SVD of `\(\hat{A}\)`; if `\(\kappa \leq \tau\)`, stop
2. Find `\(k^* = \arg\max_k |v_{K',k}|\)` — the code most loaded on the smallest singular direction
3. Collapse all siblings of `\(k^*\)` to their parent in the HISCO hierarchy; update `\(\hat{A}\)` and `\(\hat{r}\)` in `\(O(K'^2)\)`
4. Repeat until `\(\kappa \leq \tau\)`
]

.pull-right[
### Trade-off

- **Fine codes** `\(\Rightarrow\)` sharper category means, but `\(\hat{A}\)` risks near-singularity
- **Coarse codes** `\(\Rightarrow\)` stable `\(\hat{A}\)`, but category means are pooled
- Aggregation introduces bias only if merged codes have genuinely different true means
- `\(\tau = 30\)` in practice; typically reduces the active code set by `\(\sim 10\times\)`
]
